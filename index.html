<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Commander Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Commander">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#111;--fg:#fff;--dim:rgba(255,255,255,.65);--btn:rgba(0,0,0,.35);--panel:#1d1d22}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#111;--fg:#fff;--dim:rgba(255,255,255,.65);--btn:rgba(0,0,0,.35);--panel:#1d1d22}}
:root[data-theme="dark"]{--bg:#111;--fg:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,Helvetica,Arial,sans-serif;overflow:hidden;touch-action:manipulation}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#g{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;bottom:env(safe-area-inset-bottom,0px);display:-ms-grid;display:grid;grid-gap:3px;background:#000}
.p{position:relative;overflow:hidden;text-align:center}
.flip{-webkit-transform:rotate(180deg);transform:rotate(180deg)}
.wide{grid-column:1 / span 2}
.nm{position:absolute;top:6px;left:10%;width:80%;z-index:2;padding:6px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:transparent;border:0;font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.life{position:absolute;top:50%;left:0;right:0;margin-top:-11vmin;font-size:22vmin;line-height:22vmin;font-weight:700}
.half{position:absolute;top:0;bottom:0;width:50%;border:0;background:transparent;color:var(--dim);font-size:9vmin;padding:0;font-family:inherit}
.half.l{left:0;text-align:left;padding-left:5%}
.half.r{right:0;text-align:right;padding-right:5%}
.foot{position:absolute;bottom:8px;left:0;right:0;z-index:2}
.foot button,.pill{display:inline-block;margin:0 5px;padding:9px 14px;border-radius:20px;border:0;background:var(--btn);color:var(--fg);font-size:15px;font-family:inherit}
.in{position:absolute;top:0;left:0;width:100%;height:100%}
.p{text-shadow:0 1px 3px rgba(0,0,0,.4)}
.sym{position:absolute;top:10%;left:10%;width:80%;height:80%;opacity:.16;pointer-events:none}
.sym svg{display:block;width:100%;height:100%}
.dlt{position:absolute;top:50%;left:0;right:0;margin-top:11vmin;font-size:6.5vmin;font-weight:700;line-height:1;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.hd .life{font-size:15vmin;line-height:15vmin;margin-top:-7.5vmin}
.hd .dlt{margin-top:8vmin;font-size:5vmin}
.dlt.up{color:#a8ffa8}
.dlt.dn{color:#ffb0b0}
.foot button.mon{background:#f5c542;color:#000}
.crowned{box-shadow:inset 0 0 0 5px #f5c542}
.dead::after{content:"\2620";position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);font-size:30vmin;line-height:1;padding-top:30%;z-index:3;pointer-events:none}
.ov{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--panel);z-index:5;padding:14px 18px;text-align:left;overflow:auto}
.row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:18px}
.row b{display:inline-block;min-width:44px;text-align:center;font-size:26px}
.row b.lethal{color:#ff6b6b}
.sm{width:46px;height:46px;border-radius:23px;border:0;background:rgba(255,255,255,.14);color:var(--fg);font-size:26px;padding:0;font-family:inherit}
.done{display:block;margin:14px auto 0;padding:11px 30px;border:0;border-radius:22px;background:#fff;color:#000;font-size:17px;font-family:inherit}
h3{margin:0 0 6px;font-size:16px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
#mb{position:fixed;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:27px;border:3px solid #000;background:#eee;color:#000;font-size:24px;z-index:9;padding:0;font-family:inherit}
#menu{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:20;text-align:center;padding-top:4vh;padding-bottom:20px;overflow:auto;-webkit-overflow-scrolling:touch}
#menu .pill{background:rgba(255,255,255,.14);margin:5px;padding:13px 20px;font-size:19px}
#menu .on{background:#fff;color:#000}
#menu h3{margin-top:16px}
</style>
</head>
<body>
<div id="g"></div>
<button id="mb" data-a="menu">&#9776;</button>
<div id="menu" style="display:none"></div>
<script>
(function(){
var COLORS=[['#d9534f','#5a1620'],['#3fae7a','#0f3b2b'],['#4f8fd9','#142a55'],['#d6c58a','#7a6628'],['#5b4f69','#0e0a14'],['#aab1b9','#3a3f45']];
var SYM=[
'<path d="M50 14C52 30 70 38 70 60a20 20 0 0 1 -40 0C30 50 36 44 40 40C40 48 44 52 48 52C44 40 46 26 50 14Z"/>',
'<circle cx="50" cy="34" r="16"/><circle cx="34" cy="50" r="15"/><circle cx="66" cy="50" r="15"/><rect x="46" y="52" width="8" height="30"/>',
'<path d="M50 16C50 16 28 44 28 58a22 22 0 0 0 44 0C72 44 50 16 50 16Z"/>',
'<circle cx="50" cy="50" r="12"/><g stroke="#fff" stroke-width="6" stroke-linecap="round"><path fill="none" d="M72 50H84M16 50H28M50 16V28M50 72V84M65.6 65.6L74 74M34.4 34.4L26 26M65.6 34.4L74 26M34.4 65.6L26 74"/></g>',
'<path fill-rule="evenodd" d="M50 20C33 20 24 32 24 46C24 55 28 60 33 63V76H67V63C72 60 76 55 76 46C76 32 67 20 50 20ZM32 46a7 7 0 1 0 14 0a7 7 0 1 0 -14 0ZM54 46a7 7 0 1 0 14 0a7 7 0 1 0 -14 0ZM50 54L45 63H55ZM42 68h4v6h-4ZM54 68h4v6h-4Z"/>',
'<path d="M50 14L80 50L50 86L20 50Z"/>'];
function symHtml(i){return '<div class="sym"><svg viewBox="0 0 100 100" fill="#fff" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="3"/>'+SYM[i]+'</svg></div>';}
var KEY='cmdr-tracker-v1';
function fresh(n,start,old){var p=[],i,j,c;for(i=0;i<n;i++){c=[];for(j=0;j<n;j++)c.push(0);p.push({name:(old&&old.players[i]&&old.players[i].name)||'',life:start,poison:0,cmd:c});}return{n:n,start:start,players:p,open:-1,monarch:-1,layout:(old&&old.layout)||'across',heads:(old&&old.heads)||'none'};}
function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.players&&o.players.length===o.n){o.open=-1;if(o.monarch===undefined)o.monarch=-1;if(!o.layout)o.layout='across';if(!o.heads)o.heads='none';return o;}}}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var S=load()||fresh(4,40);
var menuOpen=false;
var g=document.getElementById('g'),menu=document.getElementById('menu');

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pname(i){return S.players[i].name||('Player '+(i+1));}
function dead(p){var i;if(p.life<=0||p.poison>=10)return true;for(i=0;i<p.cmd.length;i++)if(p.cmd[i]>=21)return true;return false;}
function flipped(i){return S.layout!=='same'&&S.layout!=='around'&&(S.n===2?i===0:i<2);}
function seats(n){var hd=S.heads||'none',top=(hd==='top'||hd==='both'),bot=(hd==='bottom'||hd==='both'),nh=(top?1:0)+(bot?1:0),s=n-nh,L=Math.ceil(s/2),R=s-L,r0=top?2:1,sr=s>0?L:0,p=[],k;
  if(top)p.push({r:180,hd:1,st:';grid-column:1 / 3;grid-row:1'});
  if(bot)p.push({r:0,hd:1,st:';grid-column:1 / 3;grid-row:'+(r0+sr)});
  for(k=0;k<s;k++){if(k<L)p.push({r:90,st:';grid-column:'+(R===0?'1 / 3':'1')+';grid-row:'+(r0+k)});else p.push({r:-90,st:';grid-column:2;grid-row:'+(k===s-1?(r0+k-L)+' / '+(r0+L):(r0+k-L))});}
  return{p:p,tpl:(top?'1fr ':'')+(sr?'repeat('+sr+',1fr) ':'')+(bot?'1fr':'')};}
function placeStyle(i,n,L){if(i<L)return ';grid-column:1;grid-row:'+(i+1);var r=i-L+1;return ';grid-column:2;grid-row:'+(i===n-1?r+' / '+(L+1):r);}

function render(){
  var n=S.n,rows=(n===2)?2:(n<=4?2:3),cols=(n===2)?1:2,h='',i,j,p,cls,k;
  for(k in holds)stopHold(k);
  var ar=S.layout==='around',L=Math.ceil(n/2),sd=ar?seats(n):null;
  if(ar){cols=2;}
  g.style.gridTemplateColumns=cols===1?'1fr':'1fr 1fr';
  g.style.gridTemplateRows=ar?sd.tpl:'repeat('+rows+',1fr)';
  for(i=0;i<n;i++){
    p=S.players[i];
    cls='p'+((ar?sd.p[i].r===180:flipped(i))?' flip':'')+((n===3&&i===2&&!ar)?' wide':'')+(dead(p)?' dead':'')+(S.monarch===i?' crowned':'')+(ar&&sd.p[i].hd?' hd':'');
    h+='<div class="'+cls+'" id="c'+i+'" style="background:linear-gradient(160deg,'+COLORS[i][0]+','+COLORS[i][1]+')'+(ar?sd.p[i].st:'')+'">';
    h+='<div class="in"'+(ar&&(sd.p[i].r===90||sd.p[i].r===-90)?' data-r="'+sd.p[i].r+'"':'')+'>';
    h+=symHtml(i);
    h+='<button class="nm" data-a="rename" data-i="'+i+'">'+esc(pname(i))+'</button>';
    h+='<div class="life" id="l'+i+'">'+p.life+'</div>';
    h+='<div class="dlt" id="d'+i+'"></div>';
    h+='<button class="half l" data-a="life" data-i="'+i+'" data-d="-1">&minus;</button>';
    h+='<button class="half r" data-a="life" data-i="'+i+'" data-d="1">+</button>';
    h+='<div class="foot"><button data-a="open" data-i="'+i+'">&#9876; Cmdr</button>';
    h+='<span class="pill">&#9760; '+p.poison+'</span>';
    h+='<button class="'+(S.monarch===i?'mon':'')+'" data-a="monarch" data-i="'+i+'">&#128081;</button></div>';
    if(S.open===i){
      h+='<div class="ov"><h3>Commander damage taken</h3>';
      for(j=0;j<n;j++){
        if(j===i)continue;
        h+='<div class="row"><span>From '+esc(pname(j))+'</span><span>';
        h+='<button class="sm" data-a="cmd" data-i="'+i+'" data-j="'+j+'" data-d="-1">&minus;</button>';
        h+='<b'+(p.cmd[j]>=21?' class="lethal"':'')+'>'+p.cmd[j]+'</b>';
        h+='<button class="sm" data-a="cmd" data-i="'+i+'" data-j="'+j+'" data-d="1">+</button></span></div>';
      }
      h+='<div class="row"><span>Poison counters</span><span>';
      h+='<button class="sm" data-a="poison" data-i="'+i+'" data-d="-1">&minus;</button>';
      h+='<b'+(p.poison>=10?' class="lethal"':'')+'>'+p.poison+'</b>';
      h+='<button class="sm" data-a="poison" data-i="'+i+'" data-d="1">+</button></span></div>';
      h+='<button class="done" data-a="close">Done</button></div>';
    }
    h+='</div></div>';
  }
  g.innerHTML=h;fit();for(k in deltas)paintDelta(k);
}

function renderMenu(){
  var h='<h3>Players</h3>',k;
  for(k=2;k<=6;k++)h+='<button class="pill'+(S.n===k?' on':'')+'" data-a="n" data-v="'+k+'">'+k+'</button>';
  h+='<h3>Starting life</h3>';
  [20,30,40].forEach(function(v){h+='<button class="pill'+(S.start===v?' on':'')+'" data-a="start" data-v="'+v+'">'+v+'</button>';});
  h+='<h3>Table layout</h3>';
  [['across','Face to face'],['around','Around the sides'],['same','All upright']].forEach(function(o){h+='<button class="pill'+((S.layout||'across')===o[0]?' on':'')+'" data-a="layout" data-s="'+o[0]+'">'+o[1]+'</button>';});
  if(S.layout==='around'){h+='<h3>Head of table seats</h3>';[['none','None'],['top','Top'],['bottom','Bottom'],['both','Top + bottom']].forEach(function(o){h+='<button class="pill'+((S.heads||'none')===o[0]?' on':'')+'" data-a="heads" data-s="'+o[0]+'">'+o[1]+'</button>';});}
  h+='<h3>&nbsp;</h3><button class="pill" data-a="reset">New game</button><button class="pill" data-a="closemenu">Close</button>';
  menu.innerHTML=h;
}

document.addEventListener('click',function(e){
  var t=e.target,a,i,j,d,v,p;
  while(t&&t!==document&&!(t.getAttribute&&t.getAttribute('data-a')))t=t.parentNode;
  if(!t||t===document)return;
  a=t.getAttribute('data-a');i=parseInt(t.getAttribute('data-i'),10);j=parseInt(t.getAttribute('data-j'),10);
  d=parseInt(t.getAttribute('data-d'),10);v=parseInt(t.getAttribute('data-v'),10);
  p=S.players[i];
  if(a==='life'){return;}
  else if(a==='open'){S.open=i;}
  else if(a==='close'){S.open=-1;}
  else if(a==='rename'){var nn=window.prompt('Player name',S.players[i].name||'');if(nn===null)return;S.players[i].name=nn.replace(/^\s+|\s+$/g,'').slice(0,16);}
  else if(a==='monarch'){S.monarch=(S.monarch===i)?-1:i;}
  else if(a==='cmd'){if(d>0||p.cmd[j]>0){p.cmd[j]+=d;p.life-=d;bump(i,-d);}}
  else if(a==='poison'){p.poison=Math.max(0,p.poison+d);}
  else if(a==='menu'){menuOpen=true;menu.style.display='block';renderMenu();return;}
  else if(a==='closemenu'){menuOpen=false;menu.style.display='none';return;}
  else if(a==='layout'){S.layout=t.getAttribute('data-s');renderMenu();}
  else if(a==='heads'){S.heads=t.getAttribute('data-s');renderMenu();}
  else if(a==='n'){S=fresh(v,S.start,S);renderMenu();}
  else if(a==='start'){S=fresh(S.n,v,S);renderMenu();}
  else if(a==='reset'){S=fresh(S.n,S.start,S);menuOpen=false;menu.style.display='none';}
  save();render();
},false);

var holds={},deltas={};
function bump(i,d){var o=deltas[i];if(!o)o=deltas[i]={v:0};o.v+=d;clearTimeout(o.t);o.t=setTimeout(function(){delete deltas[i];paintDelta(i);},2500);paintDelta(i);}
function paintDelta(i){var el=document.getElementById('d'+i),o=deltas[i];if(!el)return;if(!o||o.v===0){el.textContent='';el.className='dlt';return;}el.textContent=(o.v>0?'+':'-')+Math.abs(o.v);el.className='dlt '+(o.v>0?'up':'dn');}
function fit(){var els=g.querySelectorAll('.in'),k,e,r,c,w,h;for(k=0;k<els.length;k++){e=els[k];r=e.getAttribute('data-r');if(!r){e.style.cssText='';continue;}c=e.parentNode;w=c.clientWidth;h=c.clientHeight;e.style.width=h+'px';e.style.height=w+'px';e.style.left=((w-h)/2)+'px';e.style.top=((h-w)/2)+'px';e.style.webkitTransform='rotate('+r+'deg)';e.style.transform='rotate('+r+'deg)';}}
window.addEventListener('resize',fit,false);
window.addEventListener('orientationchange',function(){setTimeout(fit,300);},false);
function findA(t){while(t&&t!==document){if(t.getAttribute&&t.getAttribute('data-a')==='life')return t;t=t.parentNode;}return null;}
function refresh(i){var p=S.players[i],c=document.getElementById('c'+i),l=document.getElementById('l'+i);if(!c||!l)return;l.textContent=p.life;c.className=c.className.replace(/ dead/g,'')+(dead(p)?' dead':'');}
function startHold(key,el){var i=parseInt(el.getAttribute('data-i'),10),d=parseInt(el.getAttribute('data-d'),10),n=0,h={};
  function step(m){S.players[i].life+=d*m;bump(i,d*m);refresh(i);save();}
  step(1);
  h.t=setTimeout(function(){h.iv=setInterval(function(){n++;step(n>15?5:1);},100);},400);
  holds[key]=h;}
function stopHold(key){var h=holds[key];if(!h)return;clearTimeout(h.t);clearInterval(h.iv);delete holds[key];}
document.addEventListener('touchstart',function(e){var k,t,el;for(k=0;k<e.changedTouches.length;k++){t=e.changedTouches[k];el=findA(t.target);if(el){e.preventDefault();startHold('t'+t.identifier,el);}}},{passive:false});
function endT(e){var k;for(k=0;k<e.changedTouches.length;k++)stopHold('t'+e.changedTouches[k].identifier);}
document.addEventListener('touchend',endT,false);
document.addEventListener('touchcancel',endT,false);
document.addEventListener('mousedown',function(e){var el=findA(e.target);if(el)startHold('m',el);},false);
document.addEventListener('mouseup',function(){stopHold('m');},false);
document.addEventListener('gesturestart',function(e){e.preventDefault();},false);
document.addEventListener('touchmove',function(e){if(!e.target.closest||!e.target.closest('.ov,#menu'))e.preventDefault();},{passive:false});
render();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}});}
</script>
</body>
</html>
